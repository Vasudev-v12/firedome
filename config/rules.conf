# Rule format:
# [ACTION] [DIRECTION] [VALUE]

# ACTION = {POLICY, BLOCK, ALLOW, BLOCK_PORT, ALLOW_PORT}
# DIRECTION = {INPUT, OUTPUT}
# VALUE = {ACCEPT, DROP, Desired IP address or port value}

# Example:
# POLICY [DIRECTION] [ACCEPT/DROP]
# ACTION [DIRECTION] [VALUE]

# Default policies
POLICY INPUT DROP
POLICY OUTPUT ACCEPT
POLICY FORWARD DROP

# Incoming traffic
ALLOW INPUT 192.168.1.100
ALLOW_PORT INPUT 22
ALLOW_PORT INPUT 80
ALLOW_PORT INPUT 443

# Outgoing traffic
BLOCK_PORT OUTPUT 25
